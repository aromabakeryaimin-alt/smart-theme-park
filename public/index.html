<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smart Theme Park</title><link rel="stylesheet" href="/css/style.css"></head>
<body><header><strong>🎡 SMART THEME PARK</strong><a href="/admin.html">員工／管理員入口</a></header><main>
<section class="card"><h1>歡迎來到智慧樂園</h1><p class="muted">手機購票及現場櫃檯購票使用不同入園方式。</p>
<div class="grid"><article class="card"><h2>手機購票</h2><p>網上付款尚未啟用。你可以先建立待付款訂單；付款服務接入並確認收款後，系統才會發出 QR 電子票。</p><a href="/mobile-ticket.html"><button>手機購票</button></a><p class="muted">入園方式：QR Code</p></article>
<article class="card"><h2>現場櫃檯購票</h2><p>現金付款後由員工登記遊客人臉，門票綁定人臉，不會生成 QR Code。</p><a href="/admin.html"><button class="secondary">前往員工入口</button></a><p class="muted">入園方式：人臉核驗</p></article></div></section>
<section class="card"><h2>入園規則</h2><ul><li>手機網上票：只使用 QR Code，不登記人臉。</li><li>現場櫃檯票：只使用人臉核驗，不生成 QR Code。</li><li>每張門票只可核銷一次。</li><li>網上付款尚未接通前，不會發出有效手機門票。</li></ul></section>
</main></body></html>
